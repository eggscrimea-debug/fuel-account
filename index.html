<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Топливо">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Учет топлива</title>
<style>
:root{--blue:#17365D;--blue2:#1F4E78;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#6b7280;--green:#16834a;--red:#c62828;--line:#e5e7eb;--yellow:#fff8dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px #00000008}
.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:20px;font-weight:700;margin-top:5px}
.green{color:var(--green)}.red{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
button{border:0;border-radius:13px;padding:13px 10px;font-size:15px;font-weight:650;background:var(--blue2);color:#fff}
button.secondary{background:#e9eef4;color:var(--blue)}button.danger{background:#fdeaea;color:var(--red)}
button.smallbtn{padding:8px 10px;font-size:13px}
h2{font-size:18px;margin:20px 2px 10px}.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:13px;color:var(--muted)}
.profit{font-weight:750;font-size:18px}.tag{display:inline-block;background:#eef3f8;color:var(--blue);border-radius:999px;padding:4px 8px;font-size:12px}
.actions2{display:flex;gap:7px;margin-top:10px}.actions2 button{flex:1}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
nav button{background:transparent;color:var(--muted);padding:7px 18px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:24px 10px}
.section{display:none}.section.active{display:block}.topline{display:flex;justify-content:space-between;align-items:center}
.danger-link{color:var(--red);background:none;padding:5px}.settings{margin-top:18px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(3,180px)}.modal{align-items:center;justify-content:center}.sheet{max-width:500px;border-radius:20px}}
</style>
</head>
<body>
<header><h1>Учет топлива</h1></header>
<div class="wrap">
<section id="home" class="section active">
<div class="grid">
<div class="card kpi"><div class="label">Выручка</div><div id="kRevenue" class="value">0 ₽</div></div>
<div class="card kpi"><div class="label">Себестоимость</div><div id="kCost" class="value">0 ₽</div></div>
<div class="card kpi"><div class="label">Расходы</div><div id="kExpenses" class="value">0 ₽</div></div>
<div class="card kpi"><div class="label">Прибыль</div><div id="kProfit" class="value green">0 ₽</div></div>
</div>
<div class="actions">
<button onclick="openForm('purchase')">＋ Закупка</button>
<button onclick="openForm('sale')">＋ Продажа</button>
<button onclick="openForm('expense')">＋ Расход</button>
</div>
<div class="topline"><h2>Закупки</h2><span id="purchaseCount" class="small"></span></div>
<div id="purchaseList" class="list"></div>
<div class="settings card">
<b>Резервная копия</b>
<div class="small" style="margin:6px 0 10px">Сохрани копию данных в «Файлы» и используй её для восстановления на этом или другом телефоне.</div>
<div class="actions2">
<button class="secondary smallbtn" onclick="backup()">Экспорт</button>
<button class="secondary smallbtn" onclick="document.getElementById('importFile').click()">Импорт</button>
</div>
<input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="restore(event)">
</div>
</section>
<section id="sales" class="section">
<div class="topline"><h2>Продажи</h2><button onclick="openForm('sale')">＋ Продажа</button></div>
<div id="salesList" class="list"></div>
</section>
<section id="expenses" class="section">
<div class="topline"><h2>Расходы</h2><button onclick="openForm('expense')">＋ Расход</button></div>
<div id="expensesList" class="list"></div>
</section>
</div>
<nav><button onclick="showSection('home')">Главная</button><button onclick="showSection('sales')">Продажи</button><button onclick="showSection('expenses')">Расходы</button></nav>

<div id="modal" class="modal" onclick="if(event.target===this)closeForm()"><div class="sheet">
<div class="topline"><h2 id="formTitle">Добавить</h2><button class="danger-link" onclick="closeForm()">Закрыть</button></div>
<form id="form" onsubmit="saveForm(event)">
<input type="hidden" id="type"><input type="hidden" id="editIndex">
<label>Дата</label><input id="date" type="date" required>
<div id="purchaseFields">
<label>ID закупки</label><input id="purchaseId" placeholder="Например: З-001" required>
<label>Марка топлива</label><input id="brand" placeholder="Например: ДТ" required>
<label>Количество, л</label><input id="qty" type="number" min="0.01" step="0.01" required>
<label>Цена закупки, ₽/л</label><input id="price" type="number" min="0" step="0.01" required>
</div>
<div id="saleFields" style="display:none">
<label>Закупка</label><select id="salePurchase" required></select>
<label>Количество, л</label><input id="saleQty" type="number" min="0.01" step="0.01" required>
<label>Цена продажи, ₽/л</label><input id="salePrice" type="number" min="0" step="0.01" required>
<label>Комментарий</label><input id="saleComment">
</div>
<div id="expenseFields" style="display:none">
<label>Закупка</label><select id="expensePurchase" required></select>
<label>Вид расхода</label><input id="expenseType" placeholder="Например: доставка" required>
<label>Сумма, ₽</label><input id="expenseAmount" type="number" min="0" step="0.01" required>
<label>Комментарий</label><input id="expenseComment">
</div>
<div class="form-actions"><button type="button" class="secondary" onclick="closeForm()">Отмена</button><button type="submit">Сохранить</button></div>
</form></div></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const KEY = "fuel-account-v3";

let db;
try {
  db = JSON.parse(localStorage.getItem(KEY) || '{"purchases":[],"sales":[],"expenses":[]}');
  if (!db || !Array.isArray(db.purchases) || !Array.isArray(db.sales) || !Array.isArray(db.expenses)) {
    throw new Error("bad data");
  }
} catch (e) {
  db = { purchases: [], sales: [], expenses: [] };
}

const ui = {
  kRevenue: $("kRevenue"),
  kCost: $("kCost"),
  kExpenses: $("kExpenses"),
  kProfit: $("kProfit"),
  purchaseCount: $("purchaseCount"),
  purchaseList: $("purchaseList"),
  salesList: $("salesList"),
  expensesList: $("expensesList"),
  modal: $("modal"),
  form: $("form"),
  formTitle: $("formTitle"),
  type: $("type"),
  editIndex: $("editIndex"),
  date: $("date"),
  purchaseFields: $("purchaseFields"),
  saleFields: $("saleFields"),
  expenseFields: $("expenseFields"),
  purchaseId: $("purchaseId"),
  brand: $("brand"),
  qty: $("qty"),
  price: $("price"),
  salePurchase: $("salePurchase"),
  saleQty: $("saleQty"),
  salePrice: $("salePrice"),
  saleComment: $("saleComment"),
  expensePurchase: $("expensePurchase"),
  expenseType: $("expenseType"),
  expenseAmount: $("expenseAmount"),
  expenseComment: $("expenseComment"),
  importFile: $("importFile")
};

const rub = (n) => new Intl.NumberFormat("ru-RU", {
  style: "currency",
  currency: "RUB",
  maximumFractionDigits: 2
}).format(Number(n) || 0);

const num = (n) => new Intl.NumberFormat("ru-RU", {
  maximumFractionDigits: 2
}).format(Number(n) || 0);

const today = () => new Date().toISOString().slice(0, 10);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[m]));

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (e) {
    alert("Не удалось сохранить данные на этом устройстве. Проверь разрешения Safari для сайта.");
    return false;
  }
  render();
  return true;
}

function nextId() {
  let n = 1;
  while (db.purchases.some((x) => x.id === "З-" + String(n).padStart(3, "0"))) n++;
  return "З-" + String(n).padStart(3, "0");
}

function stats(p) {
  const sales = db.sales.filter((x) => x.purchaseId === p.id);
  const expenses = db.expenses.filter((x) => x.purchaseId === p.id);
  const sold = sales.reduce((a, x) => a + Number(x.qty || 0), 0);
  const revenue = sales.reduce((a, x) => a + Number(x.qty || 0) * Number(x.price || 0), 0);
  const exp = expenses.reduce((a, x) => a + Number(x.amount || 0), 0);
  const cost = sold * Number(p.buyPrice || 0);
  return {
    sold,
    revenue,
    cost,
    exp,
    profit: revenue - cost - exp,
    rest: Number(p.qty || 0) - sold
  };
}

function render() {
  let revenue = 0, cost = 0, expenses = 0, profit = 0;

  db.purchases.forEach((p) => {
    const x = stats(p);
    revenue += x.revenue;
    cost += x.cost;
    expenses += x.exp;
    profit += x.profit;
  });

  ui.kRevenue.textContent = rub(revenue);
  ui.kCost.textContent = rub(cost);
  ui.kExpenses.textContent = rub(expenses);
  ui.kProfit.textContent = rub(profit);
  ui.kProfit.className = "value " + (profit < 0 ? "red" : "green");

  ui.purchaseCount.textContent = db.purchases.length + " шт.";

  if (db.purchases.length) {
    ui.purchaseList.innerHTML = db.purchases.slice().reverse().map((p) => {
      const x = stats(p);
      const i = db.purchases.indexOf(p);
      return `<div class="card">
        <div class="row">
          <div>
            <b>${esc(p.id)}</b> <span class="tag">${esc(p.brand)}</span>
            <div class="small">${esc(p.date)} · ${rub(p.buyPrice)}/л · куплено ${num(p.qty)} л</div>
          </div>
          <div class="profit ${x.profit < 0 ? "red" : "green"}">${rub(x.profit)}</div>
        </div>
        <div class="small" style="margin-top:10px">
          Продано ${num(x.sold)} л · остаток ${num(x.rest)} л · выручка ${rub(x.revenue)} · расходы ${rub(x.exp)}
        </div>
        <div class="actions2">
          <button class="secondary smallbtn" onclick="editPurchase(${i})">Изменить</button>
          <button class="danger smallbtn" onclick="deletePurchase(${i})">Удалить</button>
        </div>
      </div>`;
    }).join("");
  } else {
    ui.purchaseList.innerHTML = '<div class="card empty">Пока нет закупок</div>';
  }

  if (db.sales.length) {
    ui.salesList.innerHTML = db.sales.slice().reverse().map((x, reverseIndex) => {
      const i = db.sales.length - 1 - reverseIndex;
      return `<div class="card">
        <div class="row">
          <div>
            <b>${esc(x.purchaseId)}</b>
            <div class="small">${esc(x.date)} · ${num(x.qty)} л × ${rub(x.price)}/л</div>
          </div>
          <b>${rub(Number(x.qty || 0) * Number(x.price || 0))}</b>
        </div>
        ${x.comment ? `<div class="small" style="margin-top:7px">${esc(x.comment)}</div>` : ""}
        <div class="actions2"><button class="danger smallbtn" onclick="deleteSale(${i})">Удалить</button></div>
      </div>`;
    }).join("");
  } else {
    ui.salesList.innerHTML = '<div class="card empty">Продаж пока нет</div>';
  }

  if (db.expenses.length) {
    ui.expensesList.innerHTML = db.expenses.slice().reverse().map((x, reverseIndex) => {
      const i = db.expenses.length - 1 - reverseIndex;
      return `<div class="card">
        <div class="row">
          <div>
            <b>${esc(x.purchaseId)}</b>
            <div class="small">${esc(x.date)} · ${esc(x.type)}</div>
          </div>
          <b>${rub(x.amount)}</b>
        </div>
        ${x.comment ? `<div class="small" style="margin-top:7px">${esc(x.comment)}</div>` : ""}
        <div class="actions2"><button class="danger smallbtn" onclick="deleteExpense(${i})">Удалить</button></div>
      </div>`;
    }).join("");
  } else {
    ui.expensesList.innerHTML = '<div class="card empty">Расходов пока нет</div>';
  }
}

function fillSelect(selectEl, selectedValue = "") {
  if (!db.purchases.length) {
    selectEl.innerHTML = '<option value="">Нет закупок</option>';
    return;
  }
  selectEl.innerHTML = db.purchases.map((p) =>
    `<option value="${esc(p.id)}">${esc(p.id)} — ${esc(p.brand)} — ${num(p.qty)} л</option>`
  ).join("");
  if (selectedValue) selectEl.value = selectedValue;
}

function openForm(type, edit = -1) {
  ui.form.reset();
  ui.date.value = today();
  ui.type.value = type;
  ui.editIndex.value = String(edit);

  ui.purchaseFields.style.display = type === "purchase" ? "block" : "none";
  ui.saleFields.style.display = type === "sale" ? "block" : "none";
  ui.expenseFields.style.display = type === "expense" ? "block" : "none";

  ui.formTitle.textContent =
    (edit >= 0 ? "Изменить " : "Новая ") +
    (type === "purchase" ? "закупку" : type === "sale" ? "продажу" : "расход");

  if (type === "purchase") {
    if (edit >= 0) {
      const p = db.purchases[edit];
      ui.date.value = p.date;
      ui.purchaseId.value = p.id;
      ui.brand.value = p.brand;
      ui.qty.value = p.qty;
      ui.price.value = p.buyPrice;
    } else {
      ui.purchaseId.value = nextId();
    }
  } else if (type === "sale") {
    fillSelect(ui.salePurchase);
  } else {
    fillSelect(ui.expensePurchase);
  }

  ui.modal.classList.add("show");
}

function closeForm() {
  ui.modal.classList.remove("show");
}

function saveForm(ev) {
  ev.preventDefault();

  const type = ui.type.value;
  const editIndex = Number(ui.editIndex.value);
  const index = Number.isFinite(editIndex) ? editIndex : -1;

  if (type === "purchase") {
    const id = ui.purchaseId.value.trim();
    const brand = ui.brand.value.trim();
    const qty = Number(ui.qty.value);
    const buyPrice = Number(ui.price.value);

    if (!id || !brand || !(qty > 0) || !(buyPrice >= 0)) {
      alert("Заполни все поля закупки.");
      return;
    }

    if (db.purchases.some((x, j) => x.id === id && j !== index)) {
      alert("Такой ID закупки уже есть.");
      return;
    }

    const old = index >= 0 ? db.purchases[index] : null;
    const sold = old
      ? db.sales.filter((x) => x.purchaseId === old.id).reduce((a, x) => a + Number(x.qty || 0), 0)
      : 0;

    if (qty < sold) {
      alert("Количество закупки нельзя сделать меньше уже проданного объема.");
      return;
    }

    const obj = { id, date: ui.date.value, brand, qty, buyPrice };

    if (old) {
      if (old.id !== obj.id) {
        db.sales.forEach((x) => { if (x.purchaseId === old.id) x.purchaseId = obj.id; });
        db.expenses.forEach((x) => { if (x.purchaseId === old.id) x.purchaseId = obj.id; });
      }
      db.purchases[index] = obj;
    } else {
      db.purchases.push(obj);
    }
  } else if (type === "sale") {
    const purchaseId = ui.salePurchase.value;
    const qty = Number(ui.saleQty.value);
    const price = Number(ui.salePrice.value);
    const p = db.purchases.find((x) => x.id === purchaseId);

    if (!p || !(qty > 0) || !(price >= 0)) {
      alert("Заполни данные продажи.");
      return;
    }

    const alreadySold = db.sales.reduce((a, x, j) =>
      a + (j === index && index >= 0 ? 0 : (x.purchaseId === purchaseId ? Number(x.qty || 0) : 0)), 0);

    if (qty > Number(p.qty) - alreadySold + 1e-9) {
      alert("Продажа больше доступного остатка.");
      return;
    }

    const obj = {
      date: ui.date.value,
      purchaseId,
      qty,
      price,
      comment: ui.saleComment.value.trim()
    };

    if (index >= 0) db.sales[index] = obj;
    else db.sales.push(obj);
  } else if (type === "expense") {
    const purchaseId = ui.expensePurchase.value;
    const expenseType = ui.expenseType.value.trim();
    const amount = Number(ui.expenseAmount.value);

    if (!purchaseId || !expenseType || !(amount >= 0)) {
      alert("Заполни данные расхода.");
      return;
    }

    const obj = {
      date: ui.date.value,
      purchaseId,
      type: expenseType,
      amount,
      comment: ui.expenseComment.value.trim()
    };

    if (index >= 0) db.expenses[index] = obj;
    else db.expenses.push(obj);
  }

  if (persist()) closeForm();
}

function editPurchase(index) {
  openForm("purchase", index);
}

function deletePurchase(index) {
  const p = db.purchases[index];
  if (!p) return;
  if (!confirm(`Удалить закупку ${p.id}? Все связанные продажи и расходы тоже будут удалены.`)) return;
  db.purchases.splice(index, 1);
  db.sales = db.sales.filter((x) => x.purchaseId !== p.id);
  db.expenses = db.expenses.filter((x) => x.purchaseId !== p.id);
  persist();
}

function deleteSale(index) {
  if (!confirm("Удалить эту продажу?")) return;
  db.sales.splice(index, 1);
  persist();
}

function deleteExpense(index) {
  if (!confirm("Удалить этот расход?")) return;
  db.expenses.splice(index, 1);
  persist();
}

function backup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "учет-топлива-" + today() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

function restore(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.purchases) || !Array.isArray(data.sales) || !Array.isArray(data.expenses)) {
        throw new Error("bad backup");
      }
      if (!confirm("Заменить текущие данные данными из резервной копии?")) return;
      db = data;
      persist();
      alert("Данные восстановлены.");
    } catch (e) {
      alert("Файл резервной копии не распознан.");
    } finally {
      ev.target.value = "";
    }
  };
  reader.readAsText(file);
}

function showSection(name) {
  document.querySelectorAll(".section").forEach((section) => section.classList.remove("active"));
  const target = $(name);
  if (target) target.classList.add("active");
}

render();
</script>
</body></html>
